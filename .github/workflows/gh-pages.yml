name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Allow this workflow to push to the gh-pages branch.
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: nvmrc
        uses: browniebroke/read-nvmrc-action@v1

      - uses: actions/setup-node@v4
        with:
          node-version: '${{ steps.nvmrc.outputs.node_version }}'
          cache: npm

      - run: npm ci

      # GitHub Pages project sites are served under /<repo>/, so build the app
      # with that base path. Asset URLs, the editor route, the service worker,
      # and the manifest all pick this up via the BASE_PATH env var.
      # (For a user/organization pages repo served at the domain root, set
      # BASE_PATH="/" instead.)
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
